name: Dev Deploy
# bin/wait-dev-deploy finds the automatic run of a commit by this title.
run-name: ${{ github.event_name == 'workflow_run' && format('Dev Deploy sha-{0}', github.event.workflow_run.head_sha) || format('Dev Deploy dispatched from {0}', github.ref_name) }}

# Builds the image once (tag sha-<git sha>, reused if it is already in ECR) and deploys it
# with Kamal to the shared dev host over the shared CI VPN. Deploys automatically after a
# Front CI push run on develop or a hotfix/* branch (decision 28); those deploys stay
# skipped until the repository variable DEV_AUTO_DEPLOY is "true".
on:
  workflow_run:
    workflows: [Front CI]
    types: [completed]
    branches: [develop, 'hotfix/*']
  workflow_dispatch:
    inputs:
      rollback_to:
        description: Full git sha of an earlier dev deploy to roll back to (empty deploys the dispatched commit)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: dev-deploy
  cancel-in-progress: false

jobs:
  preflight:
    name: 'Guard: branch, secrets, deploy parameters'
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       vars.DEV_AUTO_DEPLOY == 'true')
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: dev
    timeout-minutes: 5
    outputs:
      url: ${{ steps.guard.outputs.url }}
      image: ${{ steps.guard.outputs.image }}
      cache_image: ${{ steps.guard.outputs.cache_image }}
      service: ${{ steps.guard.outputs.service }}
      mode: ${{ steps.guard.outputs.mode }}
      version: ${{ steps.guard.outputs.version }}
      sha: ${{ steps.guard.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 'Guard: required secrets present (names only)'
        id: guard
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          VPN_CI_OVPN: ${{ secrets.VPN_CI_OVPN }}
          SRV_DEPLOY_SSH_KEY: ${{ secrets.SRV_DEPLOY_SSH_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TELEGRAM_PILOT_DEV_ALERTS_BOT_TOKEN: ${{ secrets.TELEGRAM_PILOT_DEV_ALERTS_BOT_TOKEN }}
          TELEGRAM_PILOT_DEV_ALERTS_CHAT_ID: ${{ secrets.TELEGRAM_PILOT_DEV_ALERTS_CHAT_ID }}
          TELEGRAM_PILOT_DEV_ALERTS_THREAD_ID: ${{ secrets.TELEGRAM_PILOT_DEV_ALERTS_THREAD_ID }}
          INFRA_READ_TOKEN: ${{ secrets.INFRA_READ_TOKEN }}
        run: >-
          bash deploy/preflight.sh dev
          TELEGRAM_PILOT_DEV_ALERTS_BOT_TOKEN
          TELEGRAM_PILOT_DEV_ALERTS_CHAT_ID
          TELEGRAM_PILOT_DEV_ALERTS_THREAD_ID
          INFRA_READ_TOKEN

  # Fails before the deploy when the shared CI actions cannot be checked out with INFRA_READ_TOKEN.
  vpn-up-check:
    name: 'Guard: shared CI actions available (1_mvp_infra@env/dev)'
    needs: preflight
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - name: 'Guard: INFRA_READ_TOKEN present'
        env:
          INFRA_READ_TOKEN: ${{ secrets.INFRA_READ_TOKEN }}
        run: |
          if [ -z "$INFRA_READ_TOKEN" ]; then
            echo "::error::INFRA_READ_TOKEN is not set: add the repository secret INFRA_READ_TOKEN (fine-grained token, Contents: read on the owner's 1_mvp_infra)"
            exit 1
          fi
          echo "INFRA_READ_TOKEN is set"

      - name: Check out the shared CI actions (1_mvp_infra@env/dev)
        id: infra
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/1_mvp_infra
          ref: env/dev
          path: infra-helpers
          token: ${{ secrets.INFRA_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts
            host

      - name: 'Guard: 1_mvp_infra@env/dev checked out'
        if: failure() && steps.infra.outcome == 'failure'
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "::error::cannot check out $OWNER/1_mvp_infra@env/dev with INFRA_READ_TOKEN: the token must grant Contents: read on that repository"
          exit 1

      - name: 'Guard: vpn-up, vpn-down and notify-telegram present'
        run: |
          missing=""
          for name in vpn-up vpn-down notify-telegram; do
            [ -f "infra-helpers/.github/actions/$name/action.yml" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing in 1_mvp_infra@env/dev (checked out with INFRA_READ_TOKEN):$missing"
            exit 1
          fi
          echo "vpn-up, vpn-down and notify-telegram are present in 1_mvp_infra@env/dev"

  deploy:
    name: Build, push, deploy to dev
    needs: [preflight, vpn-up-check]
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: dev
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE: ${{ needs.preflight.outputs.image }}
      MODE: ${{ needs.preflight.outputs.mode }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Check out the shared CI actions (1_mvp_infra@env/dev)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/1_mvp_infra
          ref: env/dev
          path: infra-helpers
          token: ${{ secrets.INFRA_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts
            host

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image already in ECR?
        id: image
        if: needs.preflight.outputs.mode == 'deploy'
        run: |
          if err=$(aws ecr describe-images --repository-name "$IMAGE" --image-ids "imageTag=$VERSION" 2>&1 >/dev/null); then
            echo "$VERSION is already in ECR: not rebuilding"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q ImageNotFoundException <<<"$err"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$err" >&2
            exit 1
          fi

      - if: steps.image.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      # Kamal only runs images labelled with its service name.
      - if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ needs.preflight.outputs.image }}:${{ needs.preflight.outputs.version }}
          labels: service=${{ needs.preflight.outputs.service }}
          cache-from: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ needs.preflight.outputs.cache_image }}:cache
          cache-to: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ needs.preflight.outputs.cache_image }}:cache,mode=max,image-manifest=true,oci-mediatypes=true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Kamal
        env:
          KAMAL_VERSION: 2.12.0
        run: gem install kamal -v "$KAMAL_VERSION" --no-document

      - name: VPN DNS zones (mvp and the zone in config/project.env)
        id: dns
        run: source deploy/lib.sh && load_project_env && echo "zones=mvp.up.km.ua,$PROJECT_ZONE" >> "$GITHUB_OUTPUT"

      # Taken after the build so the shared VPN lock is held only while deploying.
      - id: vpn
        uses: ./infra-helpers/.github/actions/vpn-up
        with:
          ovpn: ${{ secrets.VPN_CI_OVPN }}
          ci-vpn-ip: ${{ secrets.CI_VPN_IP }}
          dev-host: ${{ secrets.DEV_HOST }}
          dns-zones: ${{ steps.dns.outputs.zones }}

      - name: Load the deploy key
        env:
          DEV_HOST: ${{ steps.vpn.outputs.dev-host }}
          SRV_DEPLOY_SSH_KEY: ${{ secrets.SRV_DEPLOY_SSH_KEY }}
        run: |
          echo "::add-mask::$DEV_HOST"
          eval "$(ssh-agent -s)" >/dev/null
          printf '%s\n' "$SRV_DEPLOY_SSH_KEY" | ssh-add - 2>/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Deploy or roll back with Kamal
        env:
          ROLLBACK_TO: ${{ inputs.rollback_to }}
          DEV_HOST: ${{ steps.vpn.outputs.dev-host }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
        run: |
          if [ "$MODE" = rollback ]; then
            bash deploy/rollback.sh dev "$ROLLBACK_TO"
          else
            bash deploy/deploy.sh dev "$VERSION"
          fi

      - if: always()
        uses: ./infra-helpers/.github/actions/vpn-down

  notify:
    name: Notify Telegram
    needs: [preflight, vpn-up-check, deploy]
    if: always() && needs.preflight.result != 'skipped'
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: dev
    timeout-minutes: 5
    steps:
      - name: Check out the shared CI actions (1_mvp_infra@env/dev)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/1_mvp_infra
          ref: env/dev
          path: infra-helpers
          token: ${{ secrets.INFRA_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts
            host

      - name: Compose the message
        id: message
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          VPN_CHECK: ${{ needs.vpn-up-check.result }}
          DEPLOY: ${{ needs.deploy.result }}
          MODE: ${{ needs.preflight.outputs.mode }}
          VERSION: ${{ needs.preflight.outputs.version }}
          URL: ${{ needs.preflight.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$DEPLOY" = success ]; then
            echo "text=✅ Dev Deploy ($MODE) $VERSION → $URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PREFLIGHT" != success ]; then
            stage="guard (branch or secrets)"
          elif [ "$VPN_CHECK" != success ]; then
            stage="guard (shared CI actions)"
            echo "::error::shared CI actions are not available: check the repository secret INFRA_READ_TOKEN (Contents: read on the owner's 1_mvp_infra) and the guard job log"
          else
            stage="deploy"
          fi
          echo "text=❌ Dev Deploy failed at $stage: $RUN_URL" >> "$GITHUB_OUTPUT"

      - uses: ./infra-helpers/.github/actions/notify-telegram
        with:
          topic: PILOT_DEV_ALERTS
          message: ${{ steps.message.outputs.text }}
        env:
          TELEGRAM_PILOT_DEV_ALERTS_BOT_TOKEN: ${{ secrets.TELEGRAM_PILOT_DEV_ALERTS_BOT_TOKEN }}
          TELEGRAM_PILOT_DEV_ALERTS_CHAT_ID: ${{ secrets.TELEGRAM_PILOT_DEV_ALERTS_CHAT_ID }}
          TELEGRAM_PILOT_DEV_ALERTS_THREAD_ID: ${{ secrets.TELEGRAM_PILOT_DEV_ALERTS_THREAD_ID }}
