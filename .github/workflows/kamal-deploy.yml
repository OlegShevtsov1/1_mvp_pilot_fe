name: Kamal Deploy

# Deploys a release to prod with Kamal 2 (config/deploy.prod.yml) over the shared mvp VPN. Prod
# deploys only a release tag vX.Y.Z: an annotated tag whose commit is on main (a bare sha is
# refused in the guard). Nothing is built: deploy/promote.sh re-labels the image sha-<sha> that
# Dev Deploy built as prod-sha-<sha> (identical layers, verified), and deploy/deploy.sh prod checks
# the tag again and that the backend on prod is at least deploy/min-be-version (release order
# backend first), deploys, waits until the app serves it, then points the ECR tag prod-current at
# it (the image it replaces becomes prod-previous). Then release-watch watches prod health and new
# GlitchTip issues for 10 minutes and reports ✅/❌; it never acts on prod.
#
# From the public mirror (vars.MIRROR == 'true', decision 43) the run also takes source_sha, the
# primary commit of the tag: the guard checks the tag on the mirror as above, then requires that
# MIRROR_SOURCE.json records exactly that (version, source_sha) pair, and the image promoted and
# deployed is sha-<source_sha> that the primary's Dev Deploy built. The mirror builds nothing.
#
# Dual control: runs only from main, with environment=prod, confirm=prod and a release tag on
# main; the guard runs without the "prod" environment, so a refused run never sees its secrets.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [prod]
      version:
        description: Release tag vX.Y.Z (annotated, on this repository's main) whose commit Dev Deploy built
        required: true
        type: string
      source_sha:
        description: Mirror only (vars.MIRROR=true) - the 40-hex primary commit of the release tag, as in MIRROR_SOURCE.json; empty on the primary
        required: false
        type: string
        default: ''
      confirm:
        description: Type prod to deploy
        required: true
        type: string

permissions:
  contents: read

# Shared with Kamal Manage: two prod operations never overlap.
concurrency:
  group: kamal-prod
  cancel-in-progress: false

jobs:
  guard:
    name: "Guard (${{ vars.MIRROR == 'true' && 'mirror' || 'primary' }} mode): ref, confirm, release tag on main"
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.inputs.outputs.tag }}
      version: ${{ steps.source.outputs.version || steps.tag.outputs.version }}
      source_sha: ${{ steps.inputs.outputs.source_sha }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the ref and the inputs
        id: inputs
        env:
          REF: ${{ github.ref }}
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm }}
          VERSION: ${{ inputs.version }}
          MIRROR: ${{ vars.MIRROR }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: bash deploy/prod_guard.sh deploy >> "$GITHUB_OUTPUT"

      - name: Resolve the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.inputs.outputs.tag }}
        run: bash deploy/tag_check.sh "$TAG" >> "$GITHUB_OUTPUT"

      - name: Check that the tagged commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: bash deploy/main_commit_check.sh

      - name: Match the mirror tag to the primary commit (MIRROR_SOURCE.json)
        id: source
        if: vars.MIRROR == 'true'
        env:
          TAG: ${{ steps.inputs.outputs.tag }}
          SOURCE_SHA: ${{ steps.inputs.outputs.source_sha }}
        run: bash deploy/mirror_source_check.sh "$TAG" "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  preflight:
    name: 'Guard: required secrets present (names only)'
    needs: guard
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: prod
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check that every required secret is set
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          VPN_CI_OVPN: ${{ secrets.VPN_CI_OVPN }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_VPN_IP: ${{ secrets.PROD_VPN_IP }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TELEGRAM_PILOT_PROD_ALERTS_BOT_TOKEN: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_BOT_TOKEN }}
          TELEGRAM_PILOT_PROD_ALERTS_CHAT_ID: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_CHAT_ID }}
          TELEGRAM_PILOT_PROD_ALERTS_THREAD_ID: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_THREAD_ID }}
          GLITCHTIP_API_URL: ${{ secrets.GLITCHTIP_API_URL }}
          GLITCHTIP_API_TOKEN: ${{ secrets.GLITCHTIP_API_TOKEN }}
          INFRA_READ_TOKEN: ${{ secrets.INFRA_READ_TOKEN }}
        run: >-
          bash deploy/prod_preflight.sh
          TELEGRAM_PILOT_PROD_ALERTS_BOT_TOKEN
          TELEGRAM_PILOT_PROD_ALERTS_CHAT_ID
          TELEGRAM_PILOT_PROD_ALERTS_THREAD_ID
          GLITCHTIP_API_URL
          GLITCHTIP_API_TOKEN
          INFRA_READ_TOKEN

  # Fails before the deploy when the shared CI actions cannot be checked out with INFRA_READ_TOKEN.
  vpn-up-check:
    name: 'Guard: shared CI actions available (1_mvp_infra@env/dev)'
    needs: preflight
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - name: 'Guard: INFRA_READ_TOKEN present'
        env:
          INFRA_READ_TOKEN: ${{ secrets.INFRA_READ_TOKEN }}
        run: |
          if [ -z "$INFRA_READ_TOKEN" ]; then
            echo "::error::INFRA_READ_TOKEN is not set: add the repository secret INFRA_READ_TOKEN (fine-grained token, Contents: read on the owner's 1_mvp_infra)"
            exit 1
          fi
          echo "INFRA_READ_TOKEN is set"

      - name: Check out the shared CI actions (1_mvp_infra@env/dev)
        id: infra
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/1_mvp_infra
          ref: env/dev
          path: infra-helpers
          token: ${{ secrets.INFRA_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts
            host

      - name: 'Guard: 1_mvp_infra@env/dev checked out'
        if: failure() && steps.infra.outcome == 'failure'
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "::error::cannot check out $OWNER/1_mvp_infra@env/dev with INFRA_READ_TOKEN: the token must grant Contents: read on that repository"
          exit 1

      - name: 'Guard: vpn-up, vpn-down and notify-telegram present'
        run: |
          missing=""
          for name in vpn-up vpn-down notify-telegram; do
            [ -f "infra-helpers/.github/actions/$name/action.yml" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing in 1_mvp_infra@env/dev (checked out with INFRA_READ_TOKEN):$missing"
            exit 1
          fi
          echo "vpn-up, vpn-down and notify-telegram are present in 1_mvp_infra@env/dev"

  deploy:
    name: Promote, deploy to prod
    needs: [guard, preflight, vpn-up-check]
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: prod
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    outputs:
      zones: ${{ steps.dns.outputs.zones }}
    env:
      TAG: ${{ needs.guard.outputs.tag }}
      VERSION: ${{ needs.guard.outputs.version }}
      SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out the shared CI actions (1_mvp_infra@env/dev)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/1_mvp_infra
          ref: env/dev
          path: infra-helpers
          token: ${{ secrets.INFRA_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts
            host

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install crane
        env:
          CRANE_VERSION: 0.22.1
          CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
        run: |
          curl -sSfL -o "$RUNNER_TEMP/crane.tgz" "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "$CRANE_SHA256  $RUNNER_TEMP/crane.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/crane.tgz" -C "$RUNNER_TEMP/bin" crane
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Before vpn-up: a missing or altered image fails without taking the shared VPN lock.
      - name: Promote the dev-built image (no build)
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: bash deploy/promote.sh "$VERSION"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Kamal
        env:
          KAMAL_VERSION: 2.12.0
        run: gem install kamal -v "$KAMAL_VERSION" --no-document

      - name: Load the prod SSH key
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)" >/dev/null
          printf '%s\n' "$PROD_SSH_KEY" | ssh-add - 2>/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: VPN DNS zones (mvp and the zone in config/project.env)
        id: dns
        run: source deploy/lib.sh && load_project_env && echo "zones=mvp.up.km.ua,$PROJECT_ZONE" >> "$GITHUB_OUTPUT"

      - uses: ./infra-helpers/.github/actions/vpn-up
        with:
          ovpn: ${{ secrets.VPN_CI_OVPN }}
          ci-vpn-ip: ${{ secrets.CI_VPN_IP }}
          dev-host: ${{ secrets.DEV_HOST }}
          dns-zones: ${{ steps.dns.outputs.zones }}

      - name: Check that prod is reachable over the VPN
        env:
          PROD_VPN_IP: ${{ secrets.PROD_VPN_IP }}
        run: |
          for attempt in 1 2 3; do
            if nc -z -w 5 "$PROD_VPN_IP" 22; then
              echo "prod SSH is reachable over the VPN"
              exit 0
            fi
            echo "attempt $attempt: prod SSH not reachable yet"
            sleep 5
          done
          echo "::error::prod SSH is not reachable over the VPN"
          exit 1

      - name: Deploy with Kamal
        env:
          PROD_VPN_IP: ${{ secrets.PROD_VPN_IP }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BE_REPO_TOKEN: ${{ secrets.BE_REPO_READ_TOKEN }}
          MIRROR: ${{ vars.MIRROR }}
        run: bash deploy/deploy.sh prod "$TAG"

      - if: always()
        uses: ./infra-helpers/.github/actions/vpn-down

  notify:
    name: Notify Telegram
    needs: [guard, preflight, vpn-up-check, deploy]
    if: always()
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: prod
    timeout-minutes: 5
    steps:
      - name: Check out the shared CI actions (1_mvp_infra@env/dev)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/1_mvp_infra
          ref: env/dev
          path: infra-helpers
          token: ${{ secrets.INFRA_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts
            host

      - name: Compose the message
        id: message
        env:
          GUARD: ${{ needs.guard.result }}
          PREFLIGHT: ${{ needs.preflight.result }}
          VPN_CHECK: ${{ needs.vpn-up-check.result }}
          DEPLOY: ${{ needs.deploy.result }}
          VERSION: ${{ needs.guard.outputs.tag || inputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$DEPLOY" = success ]; then
            echo "text=✅ Kamal Deploy prod $VERSION succeeded: $RUN_URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GUARD" != success ]; then
            stage="guard (ref, confirm, version or mirror source)"
          elif [ "$PREFLIGHT" != success ]; then
            stage="guard (secrets)"
          elif [ "$VPN_CHECK" != success ]; then
            stage="guard (shared CI actions)"
          else
            stage="deploy"
          fi
          echo "text=❌ Kamal Deploy prod failed at $stage: $RUN_URL" >> "$GITHUB_OUTPUT"

      - uses: ./infra-helpers/.github/actions/notify-telegram
        with:
          topic: PILOT_PROD_ALERTS
          message: ${{ steps.message.outputs.text }}
        env:
          TELEGRAM_PILOT_PROD_ALERTS_BOT_TOKEN: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_BOT_TOKEN }}
          TELEGRAM_PILOT_PROD_ALERTS_CHAT_ID: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_CHAT_ID }}
          TELEGRAM_PILOT_PROD_ALERTS_THREAD_ID: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_THREAD_ID }}

  # Health of https://app.<zone> and new GlitchTip issues of <project>-fe-prod (deploy/release_watch.sh,
  # stops at the first problem). GlitchTip is reachable only over the VPN, so this job holds the
  # shared VPN lock for up to 10 minutes.
  release-watch:
    name: Release watch (10 min)
    needs: [guard, deploy]
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: prod
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check out the shared CI actions (1_mvp_infra@env/dev)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/1_mvp_infra
          ref: env/dev
          path: infra-helpers
          token: ${{ secrets.INFRA_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts
            host

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - uses: ./infra-helpers/.github/actions/vpn-up
        with:
          ovpn: ${{ secrets.VPN_CI_OVPN }}
          ci-vpn-ip: ${{ secrets.CI_VPN_IP }}
          dev-host: ${{ secrets.DEV_HOST }}
          dns-zones: ${{ needs.deploy.outputs.zones }}

      - name: Watch prod
        id: watch
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          GLITCHTIP_API_URL: ${{ secrets.GLITCHTIP_API_URL }}
          GLITCHTIP_API_TOKEN: ${{ secrets.GLITCHTIP_API_TOKEN }}
        run: bash deploy/release_watch.sh "$TAG"

      - if: always()
        uses: ./infra-helpers/.github/actions/vpn-down

      - name: Compose the message
        id: message
        if: always()
        env:
          TEXT: ${{ steps.watch.outputs.text }}
          TAG: ${{ needs.guard.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$TEXT" ]; then
            echo "text=$TEXT: $RUN_URL" >> "$GITHUB_OUTPUT"
          else
            echo "text=❌ release-watch $TAG could not run: $RUN_URL" >> "$GITHUB_OUTPUT"
          fi

      - if: always()
        uses: ./infra-helpers/.github/actions/notify-telegram
        with:
          topic: PILOT_PROD_ALERTS
          message: ${{ steps.message.outputs.text }}
        env:
          TELEGRAM_PILOT_PROD_ALERTS_BOT_TOKEN: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_BOT_TOKEN }}
          TELEGRAM_PILOT_PROD_ALERTS_CHAT_ID: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_CHAT_ID }}
          TELEGRAM_PILOT_PROD_ALERTS_THREAD_ID: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_THREAD_ID }}
