name: Kamal Manage
run-name: Kamal Manage ${{ inputs.action }}

# Operates the prod deployment over the shared mvp VPN: status, logs, restart (deploy/manage.sh),
# rollback to prod-previous or a given version (deploy/rollback.sh prod, which also moves the ECR
# tags prod-current/prod-previous), and remove, which deletes only this app from the prod host: the
# kamal-proxy there is shared with the backend.
#
# Dual control: runs only from main; restart needs confirm=prod, rollback the typed confirm
# ROLLBACK-prod, remove needs confirm=remove-prod; the guard runs without the "prod" environment,
# so a refused run never sees its secrets.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do with prod
        required: true
        type: choice
        options: [status, logs, restart, rollback, remove]
      version:
        description: Rollback target, prod-previous or the 40-hex git sha (optionally sha-<sha>) of an earlier prod deploy
        required: false
        default: ''
        type: string
      confirm:
        description: prod for restart, ROLLBACK-prod for rollback, remove-prod for remove; not needed for status and logs
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Shared with Kamal Deploy: two prod operations never overlap.
concurrency:
  group: kamal-prod
  cancel-in-progress: false

jobs:
  guard:
    name: 'Guard: ref, action, confirm'
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      sha: ${{ steps.inputs.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the ref and the inputs
        id: inputs
        env:
          REF: ${{ github.ref }}
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
          VERSION: ${{ inputs.version }}
        run: bash deploy/prod_guard.sh manage >> "$GITHUB_OUTPUT"

  preflight:
    name: 'Guard: required secrets present (names only)'
    needs: guard
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: prod
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check that every required secret is set
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          VPN_CI_OVPN: ${{ secrets.VPN_CI_OVPN }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_VPN_IP: ${{ secrets.PROD_VPN_IP }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TELEGRAM_PILOT_PROD_ALERTS_BOT_TOKEN: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_BOT_TOKEN }}
          TELEGRAM_PILOT_PROD_ALERTS_CHAT_ID: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_CHAT_ID }}
          TELEGRAM_PILOT_PROD_ALERTS_THREAD_ID: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_THREAD_ID }}
          INFRA_READ_TOKEN: ${{ secrets.INFRA_READ_TOKEN }}
        run: >-
          bash deploy/prod_preflight.sh
          TELEGRAM_PILOT_PROD_ALERTS_BOT_TOKEN
          TELEGRAM_PILOT_PROD_ALERTS_CHAT_ID
          TELEGRAM_PILOT_PROD_ALERTS_THREAD_ID
          INFRA_READ_TOKEN

  # Fails before the deploy when the shared CI actions cannot be checked out with INFRA_READ_TOKEN.
  vpn-up-check:
    name: 'Guard: shared CI actions available (1_mvp_infra@env/dev)'
    needs: preflight
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - name: 'Guard: INFRA_READ_TOKEN present'
        env:
          INFRA_READ_TOKEN: ${{ secrets.INFRA_READ_TOKEN }}
        run: |
          if [ -z "$INFRA_READ_TOKEN" ]; then
            echo "::error::INFRA_READ_TOKEN is not set: add the repository secret INFRA_READ_TOKEN (fine-grained token, Contents: read on the owner's 1_mvp_infra)"
            exit 1
          fi
          echo "INFRA_READ_TOKEN is set"

      - name: Check out the shared CI actions (1_mvp_infra@env/dev)
        id: infra
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/1_mvp_infra
          ref: env/dev
          path: infra-helpers
          token: ${{ secrets.INFRA_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts
            host

      - name: 'Guard: 1_mvp_infra@env/dev checked out'
        if: failure() && steps.infra.outcome == 'failure'
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "::error::cannot check out $OWNER/1_mvp_infra@env/dev with INFRA_READ_TOKEN: the token must grant Contents: read on that repository"
          exit 1

      - name: 'Guard: vpn-up, vpn-down and notify-telegram present'
        run: |
          missing=""
          for name in vpn-up vpn-down notify-telegram; do
            [ -f "infra-helpers/.github/actions/$name/action.yml" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing in 1_mvp_infra@env/dev (checked out with INFRA_READ_TOKEN):$missing"
            exit 1
          fi
          echo "vpn-up, vpn-down and notify-telegram are present in 1_mvp_infra@env/dev"

  manage:
    name: Manage prod
    needs: [guard, preflight, vpn-up-check]
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: prod
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check out the shared CI actions (1_mvp_infra@env/dev)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/1_mvp_infra
          ref: env/dev
          path: infra-helpers
          token: ${{ secrets.INFRA_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts
            host

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # rollback moves the ECR tags prod-current/prod-previous.
      - name: Install crane
        env:
          CRANE_VERSION: 0.22.1
          CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
        run: |
          curl -sSfL -o "$RUNNER_TEMP/crane.tgz" "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "$CRANE_SHA256  $RUNNER_TEMP/crane.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/crane.tgz" -C "$RUNNER_TEMP/bin" crane
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Kamal
        env:
          KAMAL_VERSION: 2.12.0
        run: gem install kamal -v "$KAMAL_VERSION" --no-document

      - name: Load the prod SSH key
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)" >/dev/null
          printf '%s\n' "$PROD_SSH_KEY" | ssh-add - 2>/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - uses: ./infra-helpers/.github/actions/vpn-up
        with:
          ovpn: ${{ secrets.VPN_CI_OVPN }}

      - name: Check that prod is reachable over the VPN
        env:
          PROD_VPN_IP: ${{ secrets.PROD_VPN_IP }}
        run: |
          for attempt in 1 2 3; do
            if nc -z -w 5 "$PROD_VPN_IP" 22; then
              echo "prod SSH is reachable over the VPN"
              exit 0
            fi
            echo "attempt $attempt: prod SSH not reachable yet"
            sleep 5
          done
          echo "::error::prod SSH is not reachable over the VPN"
          exit 1

      - name: Run the action with Kamal
        env:
          ACTION: ${{ inputs.action }}
          SHA: ${{ needs.guard.outputs.sha }}
          VERSION: ${{ needs.guard.outputs.version }}
          ROLLBACK_CONFIRM: ${{ inputs.confirm }}
          PROD_VPN_IP: ${{ secrets.PROD_VPN_IP }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ "$ACTION" = rollback ]; then
            bash deploy/rollback.sh prod "${SHA:-$VERSION}"
          else
            bash deploy/manage.sh "$ACTION"
          fi

      - if: always()
        uses: ./infra-helpers/.github/actions/vpn-down

  notify:
    name: Notify Telegram
    needs: [guard, preflight, vpn-up-check, manage]
    if: always()
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: prod
    timeout-minutes: 5
    steps:
      - name: Check out the shared CI actions (1_mvp_infra@env/dev)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/1_mvp_infra
          ref: env/dev
          path: infra-helpers
          token: ${{ secrets.INFRA_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts
            host

      - name: Compose the message
        id: message
        env:
          GUARD: ${{ needs.guard.result }}
          PREFLIGHT: ${{ needs.preflight.result }}
          VPN_CHECK: ${{ needs.vpn-up-check.result }}
          MANAGE: ${{ needs.manage.result }}
          ACTION: ${{ inputs.action }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$MANAGE" = success ]; then
            echo "text=✅ Kamal Manage prod $ACTION succeeded: $RUN_URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GUARD" != success ]; then
            stage="guard (ref, action or confirm)"
          elif [ "$PREFLIGHT" != success ]; then
            stage="guard (secrets)"
          elif [ "$VPN_CHECK" != success ]; then
            stage="guard (shared CI actions)"
          else
            stage="$ACTION"
          fi
          echo "text=❌ Kamal Manage prod $ACTION failed at $stage: $RUN_URL" >> "$GITHUB_OUTPUT"

      - uses: ./infra-helpers/.github/actions/notify-telegram
        with:
          topic: PILOT_PROD_ALERTS
          message: ${{ steps.message.outputs.text }}
        env:
          TELEGRAM_PILOT_PROD_ALERTS_BOT_TOKEN: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_BOT_TOKEN }}
          TELEGRAM_PILOT_PROD_ALERTS_CHAT_ID: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_CHAT_ID }}
          TELEGRAM_PILOT_PROD_ALERTS_THREAD_ID: ${{ secrets.TELEGRAM_PILOT_PROD_ALERTS_THREAD_ID }}
