server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # One policy for every HTML answer; the Dockerfile installs this file as a template, so the API origin is filled in
    # from API_URL when the container starts. Google's sources are the ones its Sign-In button documents.
    set $content_security_policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; connect-src 'self' ${API_URL} https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # index.html names the hashed bundle, so browsers must revalidate it to see a new release.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $content_security_policy always;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $content_security_policy always;
    }

    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
